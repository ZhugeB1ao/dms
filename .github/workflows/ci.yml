name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.service }}) - lint, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - account-service
          - category-service
          - department-service
          - organization-service
          - api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check -Dcheckstyle.config.location=../config/checkstyle/checkstyle.xml -Dcheckstyle.consoleOutput=true

      - name: Test
        run: ./mvnw -B test

      - name: Build
        run: ./mvnw -B package -DskipTests

  frontend:
    name: Frontend - lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker (${{ matrix.image }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auth-service
            context: auth-service
          - image: account-service
            context: account-service
          - image: category-service
            context: category-service
          - image: department-service
            context: department-service
          - image: organization-service
            context: organization-service
          - image: api-gateway
            context: api-gateway
          - image: front-end
            context: front-end
            build-args: |
              VITE_API_BASE_URL=/api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dms-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  ci-passed:
    name: CI passed
    if: always()
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra kết quả các job
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} docker=${{ needs.docker.result }}"
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.docker.result }}" = success
