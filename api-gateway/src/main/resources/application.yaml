spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          # ── Auth Service: xác thực & người dùng ─────────────────────────
          - id: auth-service
            uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/auth/**
            filters:
              - RemoveRequestHeader=Origin

          # ── Account Service: quản lý tài khoản (:8084) ──────────────────
          - id: account-service
            uri: ${ACCOUNT_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/accounts, /api/accounts/**
            filters:
              - RemoveRequestHeader=Origin

          # ── Category Service: danh mục thể loại văn bản (:8080) ─────────
          - id: category-service
            uri: ${CATEGORY_SERVICE_URL:http://localhost:8080}
            predicates:
              - Path=/api/categories, /api/categories/**
            filters:
              - RemoveRequestHeader=Origin

          # ── Department Service: danh mục phòng ban (:8082) ──────────────
          - id: department-service
            uri: ${DEPARTMENT_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/departments, /api/departments/**
            filters:
              - RemoveRequestHeader=Origin

          # ── Organization Service: cơ quan ban hành (:8083) ──────────────
          - id: organization-service
            uri: ${ORGANIZATION_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/organizations, /api/organizations/**
            filters:
              - RemoveRequestHeader=Origin

          # ── File Service: quản lý tài liệu & OCR (:8085) ────────────────
          - id: file-service
            uri: ${FILE_SERVICE_URL:http://localhost:8085}
            predicates:
              - Path=/api/documents, /api/documents/**
            filters:
              - RemoveRequestHeader=Origin

          # ── AI Service: hỏi đáp RAG & Giọng nói ─────────────────────────
          - id: ai-service-ask
            uri: ${AI_SERVICE_URL:http://localhost:8000}
            predicates:
              - Path=/api/ai/health, /api/ai/ask, /api/ai/ask/stream, /api/ai/ask/voice/stream, /api/ai/stt, /api/ai/tts, /api/ai/conversations, /api/ai/conversations/**
            filters:
              - StripPrefix=2
              - RemoveRequestHeader=Origin
              
          # Embed: POST /api/ai/embed → ai-service POST /embed
          # Delete vectors: DELETE /api/ai/embed/{id} → ai-service DELETE /embed/{id}
          - id: ai-service-embed
            uri: ${AI_SERVICE_URL:http://localhost:8000}
            predicates:
              - Path=/api/ai/embed, /api/ai/embed/**
            filters:
              - StripPrefix=2
              - RemoveRequestHeader=Origin
server:
  port: ${SERVER_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: HSU Chatbot API Gateway
    version: 1.0.0
    description: API Gateway proxy cho file-service và ai-service

gateway:
  shared-secret: ${GATEWAY_SHARED_SECRET:}
  # Cấu hình rate limiting (in-memory token bucket, mỗi IP)
  rate-limit:
    # Requests per second được phép
    ai-service-rps: ${GATEWAY_AI_RPS:10}
    file-service-rps: ${GATEWAY_FILE_RPS:20}
    auth-service-rps: ${GATEWAY_AUTH_RPS:5}

    # Burst tối đa
    ai-service-burst: ${GATEWAY_AI_BURST:20}
    file-service-burst: ${GATEWAY_FILE_BURST:40}
    auth-service-burst: ${GATEWAY_AUTH_BURST:5}

  cors:
    allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.hsu.gateway: DEBUG

grpc:
  client:
    auth-service:
      address: 'static://${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9091}'
      negotiation-type: plaintext