server.port=${SERVER_PORT:8085}
spring.application.name=document-service

# DB riêng của document-service. Trong container ghi đè bằng SPRING_DATASOURCE_*.
spring.datasource.url=jdbc:postgresql://localhost:5438/document_db
spring.datasource.username=postgres
spring.datasource.password=${DOCUMENT_DB_PASSWORD:postgres}

# Schema do Flyway (db/migration) quản lý; Hibernate chỉ kiểm tra entity khớp DB
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# category-service: kiểm tra danh mục (loại văn bản, độ khẩn, độ mật) còn hoạt động. Trong container đặt CATEGORY_SERVICE_URL.
catalog.base-url=${CATEGORY_SERVICE_URL:http://localhost:8080}
# category-service hiện chỉ nhận token mock (MockJwtAuthenticationFilter); đổi khi nó xác thực JWT thật
catalog.token=${CATALOG_TOKEN:mock-employee-token}

spring.web.error.include-message=always

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=-1
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:attachments}
minio.region=${MINIO_REGION:us-east-1}
app.attachments.max-size-bytes=${APP_ATTACHMENTS_MAX_SIZE_BYTES:10485760}
app.attachments.presign-expiry-seconds=${APP_ATTACHMENTS_PRESIGN_EXPIRY_SECONDS:300}
