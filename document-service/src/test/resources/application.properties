spring.datasource.url=jdbc:h2:mem:documents;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Chạy đúng migration thật trên H2 rồi validate entity với schema đó
spring.jpa.hibernate.ddl-auto=validate
catalog.base-url=http://localhost:1
catalog.token=test-token
spring.web.error.include-message=always

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
minio.endpoint=http://localhost:9000
minio.public-endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=attachments
minio.region=us-east-1
app.attachments.max-size-bytes=10485760
app.attachments.presign-expiry-seconds=300
