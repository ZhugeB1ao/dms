spring.application.name=organization-service
server.port=8083

# 1. Kết nối PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5435/organization_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 3. Cấu hình Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 4. Security
app.security.mock-enabled=true
app.security.gateway-secret=

# Pool kết nối cho Neon: ít kết nối, không giữ kết nối rảnh để Neon tự tắt compute (scale-to-zero).
# Kết nối đầu tiên sau khi Neon tắt mất ~1 giây để đánh thức, connection-timeout 30s là đủ.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
