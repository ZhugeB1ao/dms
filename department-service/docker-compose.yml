version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: department-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: department_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - department_postgres_data:/var/lib/postgresql/data

volumes:
  department_postgres_data:
