spring.application.name=department-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5434/department_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.mock-enabled=true
app.security.gateway-secret=

app.account-grpc.enabled=false
app.account-grpc.host=localhost
app.account-grpc.port=9092
app.account-grpc.deadline-ms=2000
app.account-grpc.mock-busy-department-ids=1

# Pool kết nối cho Neon: ít kết nối, không giữ kết nối rảnh để Neon tự tắt compute (scale-to-zero).
# Kết nối đầu tiên sau khi Neon tắt mất ~1 giây để đánh thức, connection-timeout 30s là đủ.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
