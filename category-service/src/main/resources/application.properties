spring.application.name=category-service
server.port=8080

# 1. Kết nối PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/category_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Cấu hình JPA / Hibernate
# Dùng 'validate' để Flyway toàn quyền quản lý bảng, còn Hibernate chỉ kiểm tra Entity có khớp DB không
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 3. Cấu hình Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 4. Security
app.security.mock-enabled=true
app.security.gateway-secret=
