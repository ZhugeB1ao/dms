syntax = "proto3";

package account;

option java_multiple_files = true;
option java_package = "com.example.grpc.account";

service AccountDepartmentService {
  rpc HasActiveUsersInDepartment (DepartmentCheckRequest) returns (DepartmentCheckResponse);
}

message DepartmentCheckRequest {
  int64 department_id = 1;
}

message DepartmentCheckResponse {
  bool has_active_users = 1;
}
