# Database dùng Neon (Postgres trên cloud), không chạy Postgres trong Docker.
# Điền DB_HOST, DB_USERNAME, DB_PASSWORD vào .env (cp .env.example .env). Chi tiết: HUONG_DAN_DB_CHUNG.md
name: dms-dev-databases

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    JAVA_TOOL_OPTIONS: "-Xmx256m -Xms64m -XX:+UseG1GC"
    SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Thiếu DB_USERNAME trong .env}
    SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
    APP_SECURITY_GATEWAY_SECRET: ${GATEWAY_SHARED_SECRET:-hsu-dev-gateway-secret-2026}

services:
  auth-service:
    <<: *java-service
    build: ./auth-service
    container_name: dms-auth-service
    environment:
      <<: *java-env
      SERVER_PORT: 8081
      GRPC_SERVER_PORT: 9091
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?Thiếu DB_HOST trong .env}/auth_db?sslmode=require
      APPLICATION_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      ACCOUNT_GRPC_HOST: account-service
      ACCOUNT_GRPC_PORT: 9092
    ports:
      - "127.0.0.1:8081:8081"

  account-service:
    <<: *java-service
    build: ./account-service
    container_name: dms-account-service
    environment:
      <<: *java-env
      SERVER_PORT: 8084
      GRPC_SERVER_PORT: 9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?Thiếu DB_HOST trong .env}/account_db?sslmode=require
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9091
      APP_SEED_ENABLED: ${ACCOUNT_SEED_ENABLED:-true}
    ports:
      - "127.0.0.1:8084:8084"

  category-service:
    <<: *java-service
    build: ./category-service
    container_name: dms-category-service
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?Thiếu DB_HOST trong .env}/category_db?sslmode=require
      APP_SECURITY_MOCK_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"

  department-service:
    <<: *java-service
    build: ./department-service
    container_name: dms-department-service
    environment:
      <<: *java-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?Thiếu DB_HOST trong .env}/department_db?sslmode=require
      APP_SECURITY_MOCK_ENABLED: "false"
      APP_ACCOUNT_GRPC_ENABLED: "true"
      APP_ACCOUNT_GRPC_HOST: account-service
      APP_ACCOUNT_GRPC_PORT: 9092
    ports:
      - "127.0.0.1:8082:8082"

  organization-service:
    <<: *java-service
    build: ./organization-service
    container_name: dms-organization-service
    environment:
      <<: *java-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?Thiếu DB_HOST trong .env}/organization_db?sslmode=require
      APP_SECURITY_MOCK_ENABLED: "false"
    ports:
      - "127.0.0.1:8083:8083"

  document-service:
    <<: *java-service
    build: ./document-service
    container_name: dms-document-service
    depends_on:
      category-service:
        condition: service_started
      minio:
        condition: service_started
    environment:
      <<: *java-env
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?Thiếu DB_HOST trong .env}/document_db?sslmode=require
      CATEGORY_SERVICE_URL: http://category-service:8080
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-attachments}
    ports:
      - "127.0.0.1:8085:8085"

  api-gateway:
    build: ./api-gateway
    container_name: dms-api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - account-service
      - category-service
      - department-service
      - organization-service
      - document-service
    environment:
      SERVER_PORT: 9090
      JAVA_OPTS: "-Xmx256m -Xms64m -XX:+UseG1GC"
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8084
      CATEGORY_SERVICE_URL: http://category-service:8080
      DEPARTMENT_SERVICE_URL: http://department-service:8082
      ORGANIZATION_SERVICE_URL: http://organization-service:8083
      DOCUMENT_SERVICE_URL: http://document-service:8085
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9091
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-hsu-dev-gateway-secret-2026}
    ports:
      - "9090:9090"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: dms-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: dms-minio-init
    restart: on-failure
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-attachments}"]

  front-end:
    build:
      context: ./front-end
      args:
        VITE_API_BASE_URL: /api
    container_name: dms-front-end
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      API_UPSTREAM: http://api-gateway:9090
    ports:
      - "3000:80"

volumes:
  minio_data:
