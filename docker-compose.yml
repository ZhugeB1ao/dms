name: dms-dev-databases

include:
  - docker-compose.db.yml

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    JAVA_TOOL_OPTIONS: "-Xmx256m -Xms64m -XX:+UseG1GC"
    SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
    SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
    APP_SECURITY_GATEWAY_SECRET: ${GATEWAY_SHARED_SECRET:-hsu-dev-gateway-secret-2026}

services:
  auth-service:
    <<: *java-service
    build: ./auth-service
    container_name: dms-auth-service
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      <<: *java-env
      SERVER_PORT: 8081
      GRPC_SERVER_PORT: 9091
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL:-jdbc:postgresql://auth-postgres:5432/auth_db}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Bao1234567890@}
      APPLICATION_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      ACCOUNT_GRPC_HOST: account-service
      ACCOUNT_GRPC_PORT: 9092
    ports:
      - "127.0.0.1:8081:8081"

  account-service:
    <<: *java-service
    build: ./account-service
    container_name: dms-account-service
    depends_on:
      account-postgres:
        condition: service_healthy
    environment:
      <<: *java-env
      SERVER_PORT: 8084
      GRPC_SERVER_PORT: 9092
      SPRING_DATASOURCE_URL: ${ACCOUNT_DB_URL:-jdbc:postgresql://account-postgres:5432/account_db}
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9091
      APP_SEED_ENABLED: ${ACCOUNT_SEED_ENABLED:-true}
    ports:
      - "127.0.0.1:8084:8084"

  category-service:
    <<: *java-service
    build: ./category-service
    container_name: dms-category-service
    depends_on:
      category-postgres:
        condition: service_healthy
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${CATEGORY_DB_URL:-jdbc:postgresql://category-postgres:5432/category_db}
      APP_SECURITY_MOCK_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"

  department-service:
    <<: *java-service
    build: ./department-service
    container_name: dms-department-service
    depends_on:
      department-postgres:
        condition: service_healthy
    environment:
      <<: *java-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: ${DEPARTMENT_DB_URL:-jdbc:postgresql://department-postgres:5432/department_db}
      APP_SECURITY_MOCK_ENABLED: "false"
      APP_ACCOUNT_GRPC_ENABLED: "true"
      APP_ACCOUNT_GRPC_HOST: account-service
      APP_ACCOUNT_GRPC_PORT: 9092
    ports:
      - "127.0.0.1:8082:8082"

  organization-service:
    <<: *java-service
    build: ./organization-service
    container_name: dms-organization-service
    depends_on:
      organization-postgres:
        condition: service_healthy
    environment:
      <<: *java-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: ${ORGANIZATION_DB_URL:-jdbc:postgresql://organization-postgres:5432/organization_db}
      APP_SECURITY_MOCK_ENABLED: "false"
    ports:
      - "127.0.0.1:8083:8083"

  api-gateway:
    build: ./api-gateway
    container_name: dms-api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - account-service
      - category-service
      - department-service
      - organization-service
    environment:
      SERVER_PORT: 9090
      JAVA_OPTS: "-Xmx256m -Xms64m -XX:+UseG1GC"
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8084
      CATEGORY_SERVICE_URL: http://category-service:8080
      DEPARTMENT_SERVICE_URL: http://department-service:8082
      ORGANIZATION_SERVICE_URL: http://organization-service:8083
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9091
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-hsu-dev-gateway-secret-2026}
    ports:
      - "9090:9090"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: dms-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: dms-minio-init
    restart: on-failure
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-attachments}"]

  front-end:
    build:
      context: ./front-end
      args:
        VITE_API_BASE_URL: /api
    container_name: dms-front-end
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      API_UPSTREAM: http://api-gateway:9090
    ports:
      - "3000:80"

volumes:
  minio_data:
